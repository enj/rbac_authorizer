# Soapbox extraction profile for the Kubernetes RBAC authorizer.
#
# This profile is decoded strictly. Unknown fields, duplicate keys, and multiple
# YAML documents are rejected. Run "soapbox validate" after every edit.
version: 1

source:
  repository: https://github.com/kubernetes/kubernetes.git
  importPrefix: k8s.io/kubernetes
  refs:
    # The first public release is derived from Kubernetes v1.36.1. Later semantic
    # tags, including prereleases, are tracked automatically.
    minimumRelease: v1.36.1
    includePrereleases: true
    branches:
      - master
      - release-1.36
    # Resolved during setup to the common transformed anchor commit. It is
    # written back here so ref discovery can never silently rewrite published
    # history.
    anchorCommit: ""

destination:
  module: monis.app/kk/rbac_authorizer
  repository: enj/rbac_authorizer
  remote: https://github.com/enj/rbac_authorizer.git
  branch: main
  stateRef: refs/heads/soapbox-state
  progressRefPrefix: refs/soapbox/progress/
  rootPackage: rbacauthorizer
  # Relocated Kubernetes packages keep their full upstream relative path below
  # this prefix, because nested internal elements enforce Go visibility.
  internalPrefix: internal/kk

packages:
  # Package granularity, not recursive directory copying. The sibling package
  # bootstrappolicy is deliberately excluded.
  roots:
    - plugin/pkg/auth/authorizer/rbac
  recursive: false
  assetGlobs: []

prune:
  # Exact files, never globs or directories. An absent path fails closed.
  # Removing these leaves pkg/apis/rbac/v1 with only doc.go and
  # evaluation_helpers.go, drops pkg/apis/rbac entirely, and stops import time
  # mutation of the k8s.io/api/rbac/v1 scheme builder.
  files:
    - pkg/registry/rbac/validation/internal_version_adapter.go
    - pkg/apis/rbac/v1/zz_generated.conversion.go
    - pkg/apis/rbac/v1/register.go
    - pkg/apis/rbac/v1/defaults.go
    - pkg/apis/rbac/v1/zz_generated.defaults.go
    - pkg/apis/rbac/v1/helpers.go
    - pkg/apis/rbac/v1/zz_generated.validations.go
    - pkg/apis/rbac/v1/zz_generated.deepcopy.go
  # Files that must survive pruning. An upstream rename fails the run instead of
  # silently shrinking the generated module.
  required:
    - pkg/apis/rbac/v1/doc.go
    - pkg/apis/rbac/v1/evaluation_helpers.go
    - pkg/registry/rbac/validation/policy_compact.go
    - pkg/registry/rbac/validation/rule.go
    - plugin/pkg/auth/authorizer/rbac/rbac.go
    - plugin/pkg/auth/authorizer/rbac/subject_locator.go

deny:
  # The exact unversioned internal API package. Its retained /v1 helper
  # subpackage is not denied.
  imports:
    - k8s.io/kubernetes/pkg/apis/rbac

closure:
  includeTests: false
  # Observational publication gates. They never change generated bytes, so they
  # stay out of the replay profile hash.
  limits:
    maxPackages: 8
    maxFiles: 40
    maxNonTestLines: 5000
    maxPackageGrowth: 2
  golden: testdata/closure/rbac-v1.36.1.json

types:
  policy: prefer-external
  # Retained code already uses k8s.io/api/rbac/v1, so the internal package is
  # pruned rather than rewritten.
  pairs:
    - internal: k8s.io/kubernetes/pkg/apis/rbac
      external: k8s.io/api/rbac/v1

dependencies:
  # Staging modules stay external. Copying k8s.io/apiserver would break real
  # authorizer type identity, request context keys, feature gates, and CVE
  # module identity for no measured benefit.
  policy: external
  copyPackages: []
  gates:
    # Correctness gates are never overridable.
    interoperability: true
    globalState: true
    diamond: true
    cost:
      maxCopiedPackages: 0
      maxCopiedLines: 0
      maxGeneratedFiles: 0
      maxDistinctLicenses: 0
      maxModuleZipBytes: 0
  overrides: []

# Ordered unified diffs applied before relocation and import rewriting.
patches: []

facade:
  package: rbacauthorizer
  file: authorizer.go
  assertionsFile: zz_generated_assertions.go
  exports:
    - name: New
      kind: func
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.New
    - name: RBACAuthorizer
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RBACAuthorizer
    - name: RequestToRuleMapper
      kind: interface
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RequestToRuleMapper
    - name: RoleToRuleMapper
      kind: interface
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RoleToRuleMapper
    - name: SubjectLocator
      kind: interface
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.SubjectLocator
    - name: SubjectAccessEvaluator
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.SubjectAccessEvaluator
    - name: NewSubjectAccessEvaluator
      kind: func
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.NewSubjectAccessEvaluator
    - name: RulesAllow
      kind: func
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RulesAllow
    - name: RuleAllows
      kind: func
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RuleAllows
    - name: AuthorizationRuleResolver
      kind: interface
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.AuthorizationRuleResolver
    - name: DefaultRuleResolver
      kind: type
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.DefaultRuleResolver
    - name: NewDefaultRuleResolver
      kind: func
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.NewDefaultRuleResolver
    - name: RoleGetter
      kind: interface
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.RoleGetter
    - name: RoleBindingLister
      kind: interface
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.RoleBindingLister
    - name: ClusterRoleGetter
      kind: interface
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.ClusterRoleGetter
    - name: ClusterRoleBindingLister
      kind: interface
      source: k8s.io/kubernetes/pkg/registry/rbac/validation.ClusterRoleBindingLister
  # The four lister backed adapters collide with the validation interfaces of
  # the same names, so they are exported under explicit names.
  aliases:
    - name: RoleGetterFromLister
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RoleGetter
    - name: RoleBindingListerFromLister
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.RoleBindingLister
    - name: ClusterRoleGetterFromLister
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.ClusterRoleGetter
    - name: ClusterRoleBindingListerFromLister
      kind: type
      source: k8s.io/kubernetes/plugin/pkg/auth/authorizer/rbac.ClusterRoleBindingLister
  interfaceAssertions:
    - type: RBACAuthorizer
      pointer: true
      interface: k8s.io/apiserver/pkg/authorization/authorizer.Authorizer
    - type: RBACAuthorizer
      pointer: true
      interface: k8s.io/apiserver/pkg/authorization/authorizer.RuleResolver

release:
  policy: v1-to-v0
  firstTag: v0.36.1

commit:
  authorPolicy: preserve-upstream
  # The GitHub App bot commits generated history. Its numeric user id is added
  # to the email when the App exists.
  committer:
    name: soapbox[bot]
    email: soapbox[bot]@users.noreply.github.com
  trailerKey: Kubernetes-commit
  sign: false

vanity:
  repository: enj/enj.github.io
  path: kk/rbac_authorizer/index.html
  importPath: monis.app/kk/rbac_authorizer
  repositoryURL: https://github.com/enj/rbac_authorizer
  probeURL: https://monis.app/kk/rbac_authorizer?go-get=1

# Only environment variable names live here. Secret values never do.
githubApp:
  appIDEnv: SOAPBOX_GITHUB_APP_ID
  installationIDEnv: SOAPBOX_GITHUB_INSTALLATION_ID
  privateKeyEnv: SOAPBOX_GITHUB_APP_PRIVATE_KEY
  apiBaseURL: https://api.github.com

determinism:
  toolchain: go1.26.5
  chunkSize: 200
