# Generated by soapbox setup. Read-only verification.
#
# This workflow runs on pull request code and therefore holds no credential: no
# App secret is available to it, its token may only read, and the checkout keeps
# no token in the work tree for a later step to find.
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build the engine shim
        working-directory: tools
        run: go build ./...
      - name: Vet the engine shim
        working-directory: tools
        run: go vet ./...
      - name: Test the engine shim
        working-directory: tools
        run: go test ./...
      - name: Validate the profile
        working-directory: tools
        run: go run ./cmd/soapbox validate -dir ..
